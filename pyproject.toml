[project]
name = "datasheet2md"
version = "2.1.0"
description = "Convert electronic-component PDF datasheets into clean, LLM-friendly Markdown using a local Docling installation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2",
    "tkinterdnd2>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
datasheet2md = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
